services:
  - type: web
    name: sistema-pedidos-backend
    env: python
    buildCommand: ./build.sh
    startCommand: gunicorn sistema.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.1
      - key: DATABASE_URL
        fromDatabase:
          name: pedido-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://sistema-pedidos.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://sistema-pedidos-backend.onrender.com

databases:
  - name: pedido-db
    databaseName: pedido
    user: pedido_user
    plan: free # El plan gratuito de DB en Render dura 90 días