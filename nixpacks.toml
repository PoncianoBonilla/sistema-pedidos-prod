providers = ["python", "node"]

[phases.install]
cmds = ["python -m pip install --upgrade pip && python -m pip install -r requirements.txt", "npm --prefix sistema-pedidos-ui install"]

[phases.build]
cmds = ["npm --prefix sistema-pedidos-ui run build", "python manage.py collectstatic --noinput"]

[start]
cmd = "python manage.py migrate && gunicorn sistema.wsgi:application --bind 0.0.0.0:$PORT"